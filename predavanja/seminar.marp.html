<h1 id="select---dodatki"><code>SELECT</code> - dodatki</h1>
<ul>
<li data-marpit-fragment="1">Vrnjeni stolpci so poljubni izrazi!<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naslov, ROUND(cena <span class="hljs-operator">*</span> <span class="hljs-number">1.10</span>, <span class="hljs-number">2</span>) <span class="hljs-keyword">FROM</span> knjige 
 <span class="hljs-keyword">WHERE</span> cena <span class="hljs-operator">*</span> (<span class="hljs-number">1</span> <span class="hljs-operator">+</span> davek<span class="hljs-operator">/</span><span class="hljs-number">100.0</span>) <span class="hljs-operator">&gt;</span> <span class="hljs-number">100.00</span>;
</code></pre>
</li>
<li data-marpit-fragment="2">Dodatki
<ul>
<li><code>AS</code>: pre(po)imenujemo izhodni stolpec</li>
<li><code>ORDER BY</code>: uredimo vrstice</li>
<li><code>DISTINCT</code>: v končnem rezultatu upoštevamo le različne vrstice</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="enostavna-oblika-stavka-select">Enostavna oblika stavka <code>SELECT</code></h1>
<span class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> world;

<span class="hljs-keyword">SELECT</span> name, population <span class="hljs-keyword">FROM</span> world;

<span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">AS</span> &quot;Ime države&quot; <span class="hljs-keyword">FROM</span> world;

<span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">AS</span> Ime <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> population <span class="hljs-keyword">DESC</span>;

<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> continent <span class="hljs-keyword">FROM</span> world;

<span class="hljs-keyword">SELECT</span> <span class="hljs-number">2</span> <span class="hljs-keyword">FROM</span> world <span class="hljs-keyword">WHERE</span> continent <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Europe&#x27;</span>;

<span class="hljs-keyword">SELECT</span> population<span class="hljs-operator">/</span>area <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> continent <span class="hljs-keyword">IN</span> (<span class="hljs-string">&#x27;Europe&#x27;</span>, <span class="hljs-string">&#x27;Asia&#x27;</span>, <span class="hljs-string">&#x27;Africa&#x27;</span>) <span class="hljs-keyword">AND</span>
       area <span class="hljs-keyword">BETWEEN</span> <span class="hljs-number">100000</span> <span class="hljs-keyword">AND</span> <span class="hljs-number">1000000</span>;

<span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> continent <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Europe&#x27;</span>
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> population<span class="hljs-operator">/</span>area;
</code></pre>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="poizvedbe-s-podpoizvedbami">Poizvedbe s podpoizvedbami</h1>
<ul>
<li data-marpit-fragment="1">Izpiši imena evropskih držav, ki imajo manj prebivalcev kot Slovenija.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> population <span class="hljs-operator">&lt;</span> (
         <span class="hljs-keyword">SELECT</span> population <span class="hljs-keyword">FROM</span> world
          <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Slovenia&#x27;</span>
       ) <span class="hljs-keyword">AND</span>
       continent <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Europe&#x27;</span>;
</code></pre>
</li>
<li data-marpit-fragment="2">Ali bomo dobili tudi Slovenijo?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="5" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="poizvedbe-s-podpoizvedbami-2">Poizvedbe s podpoizvedbami (2)</h1>
<ul>
<li data-marpit-fragment="1">Izpiši imena držav, ki imajo število prebivalcev med številom prebivalcev Alžirije in Kanade.</li>
<li data-marpit-fragment="2">Po korakih:
<ul>
<li data-marpit-fragment="3">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> population <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Canada&#x27;</span>;
</code></pre>
<ul>
<li>Dobimo rezultat <em>35427524</em>.</li>
</ul>
</li>
<li data-marpit-fragment="4">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> population <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Algeria&#x27;</span>;
</code></pre>
<ul>
<li>Dobimo rezultat <em>38700000</em>.</li>
</ul>
</li>
<li data-marpit-fragment="5">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> population <span class="hljs-keyword">BETWEEN</span> <span class="hljs-number">35427524</span> <span class="hljs-keyword">AND</span> <span class="hljs-number">38700000</span>;
</code></pre>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="poizvedbe-s-podpoizvedbami-3">Poizvedbe s podpoizvedbami (3)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> name <span class="hljs-keyword">FROM</span> world
 <span class="hljs-keyword">WHERE</span> population <span class="hljs-keyword">BETWEEN</span> (
         <span class="hljs-keyword">SELECT</span> population <span class="hljs-keyword">FROM</span> world
          <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Canada&#x27;</span>
       ) <span class="hljs-keyword">AND</span> (
         <span class="hljs-keyword">SELECT</span> population <span class="hljs-keyword">FROM</span> world
          <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Algeria&#x27;</span>
       );
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="1" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="with-2"><code>WITH</code> (2)</h1>
<ul>
<li data-marpit-fragment="1">Navedemo lahko tudi več podpoizvedb in se nanje sklicujemo kot na tabele:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> gospodarji_prstanov <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> film
   <span class="hljs-keyword">WHERE</span> naslov <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;Gospodar prstanov%&#x27;</span>
),
leta_gospodarjev <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> leto <span class="hljs-keyword">FROM</span> gospodarji_prstanov
),
ocene_gospodarjev <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> ocena <span class="hljs-keyword">FROM</span> gospodarji_prstanov
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> film
 <span class="hljs-keyword">WHERE</span> leto <span class="hljs-keyword">IN</span> leta_gospodarjev <span class="hljs-keyword">AND</span> 
       ocena <span class="hljs-keyword">IN</span> ocene_gospodarjev;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="3" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="velike-dr%C5%BEave">Velike države</h1>
<ul>
<li data-marpit-fragment="1">Poišči tiste države (s pripadajočimi celinami), ki imajo več kot 3x toliko prebivalcev, kot jih imajo ostale države na tej celini.</li>
<li data-marpit-fragment="2">Ideja: poiskati maksimalno število prebivalcev med tistimi državami na isti celini (potrebni bosta dve kopiji tabele), ki nimajo istega imena kot ta država.</li>
<li data-marpit-fragment="3">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> name, continent <span class="hljs-keyword">FROM</span> world <span class="hljs-keyword">AS</span> t1
 <span class="hljs-keyword">WHERE</span> population <span class="hljs-operator">&gt;</span> (
         <span class="hljs-keyword">SELECT</span> <span class="hljs-number">3</span> <span class="hljs-operator">*</span> <span class="hljs-built_in">MAX</span>(population) <span class="hljs-keyword">FROM</span> world <span class="hljs-keyword">AS</span> t2
          <span class="hljs-keyword">WHERE</span> t1.continent <span class="hljs-operator">=</span> t2.continent <span class="hljs-keyword">AND</span>

</code></pre>

<h1 id="having"><code>HAVING</code></h1>
<ul>
<li data-marpit-fragment="1"><a href="https://sqlzoo.net/wiki/SELECT_from_Nobel_Tutorial">Tabela</a>: <code>nobel(yr, subject, winner)</code></li>
<li data-marpit-fragment="2">Izpiši tista leta po letu 1970, ko je Nobelovo nagrado iz fizike (<em>Physics</em>) dobil le en posameznik.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> yr <span class="hljs-keyword">FROM</span> nobel 
 <span class="hljs-keyword">WHERE</span> subject <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Physics&#x27;</span> <span class="hljs-keyword">AND</span>
       yr <span class="hljs-operator">&gt;</span> <span class="hljs-number">1970</span>
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> yr  
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(yr) <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="having-2"><code>HAVING</code> (2)</h1>
<span class="small">
<ul>
<li data-marpit-fragment="1">
<p>Kateri posamezniki so dobili Nobelovo nagrado na dveh ali več področjih?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> winner, <span class="hljs-built_in">COUNT</span>(subject) <span class="hljs-keyword">FROM</span> nobel
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> winner
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(subject) <span class="hljs-operator">&gt;</span> <span class="hljs-number">1</span>;
</code></pre>
<table>
<thead>
<tr>
<th><code>winner</code></th>
<th><code>COUNT(subject)</code></th>
</tr>
</thead>

<tr>
<td>Frederick Sanger</td>
<td>2</td>
</tr>
<tr>
<td>John Bardeen</td>
<td>2</td>
</tr>
<tr>
<td>International Committee of the Red Cross</td>
<td>3</td>
</tr>
<tr>
<td>Linus Pauling</td>
<td>2</td>
</tr>
<tr>
<td>Marie Curie</td>
<td>2</td>
</tr>
</tbody>
</table>
</li>
<li data-marpit-fragment="2">
<p>Je to v redu?</p>
</li>
</ul>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="preverimo">Preverimo</h1>
<ul>
<li data-marpit-fragment="1">Kako bi dobili še ostale podatke zanje?<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> nobel
 <span class="hljs-keyword">WHERE</span> winner <span class="hljs-keyword">IN</span> (
         <span class="hljs-keyword">SELECT</span> winner <span class="hljs-keyword">FROM</span> nobel
          <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> winner
         <span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(subject) <span class="hljs-operator">&gt;</span> <span class="hljs-number">1</span>
       );
</code></pre>
</li>
<li data-marpit-fragment="2">Dejansko smo dobili tiste, ki so dobili Nobelovo nagrado več kot enkrat (ne glede na področje).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="1" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">

<h1 id="glavni-igralci">Glavni igralci</h1>
<ul>
<li data-marpit-fragment="1">Zanimajo nas naslovi in glavni igralci vseh tistih filmov, kjer Al Pacino <em>ni</em> bil v glavni vlogi.</li>
<li data-marpit-fragment="2">Potrebujemo podatke iz vseh treh tabel!</li>
<li data-marpit-fragment="3">Zanimajo nas le tiste vrstice, kjer imamo glavnega igralca ...
<ul>
<li><code>WHERE ord = 1</code></li>
</ul>
</li>
<li data-marpit-fragment="4">in to ni <em>Al Pacino</em>!
<ul>
<li><code>AND name &lt;&gt; 'Al Pacino'</code></li>
</ul>
</li>
<li data-marpit-fragment="5">Mora pa Al Pacino biti med igralci.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">AND</span> movie.id <span class="hljs-keyword">IN</span> (
  <span class="hljs-comment">-- seznam ID-jev filmov, kjer je igral Al Pacino</span>
)
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="3" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="seznam-filmov-z-alom-pacinom">Seznam filmov z Alom Pacinom</h1>
<ul>
<li data-marpit-fragment="1">Potrebujemo tabeli <code>casting</code> in <code>actor</code>.</li>
<li data-marpit-fragment="2">Od filmov potrebujemo samo ID - ta se nahaja v <code>casting</code>!</li>
<li data-marpit-fragment="3">Zanimajo nas samo vrstice, kjer je igralec <em>Al Pacino</em>.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> movieid <span class="hljs-keyword">FROM</span> casting
  <span class="hljs-keyword">JOIN</span> actor <span class="hljs-keyword">ON</span> actor.id <span class="hljs-operator">=</span> actorid
 <span class="hljs-keyword">WHERE</span> actor.name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Al Pacino&#x27;</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="re%C5%A1itev">Rešitev</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, name <span class="hljs-keyword">FROM</span> movie
  <span class="hljs-keyword">JOIN</span> casting <span class="hljs-keyword">ON</span> movie.id <span class="hljs-operator">=</span> movieid
  <span class="hljs-keyword">JOIN</span> actor   <span class="hljs-keyword">ON</span> actor.id <span class="hljs-operator">=</span> actorid
 <span class="hljs-keyword">WHERE</span> ord <span class="hljs-operator">=</span> <span class="hljs-number">1</span> <span class="hljs-keyword">AND</span>
       name <span class="hljs-operator">&lt;&gt;</span> <span class="hljs-string">&#x27;Al Pacino&#x27;</span> <span class="hljs-keyword">AND</span>
       movie.id <span class="hljs-keyword">IN</span> (
         <span class="hljs-keyword">SELECT</span> movieid <span class="hljs-keyword">FROM</span> casting
           <span class="hljs-keyword">JOIN</span> actor <span class="hljs-keyword">ON</span> actor.id <span class="hljs-operator">=</span> actorid
          <span class="hljs-keyword">WHERE</span> actor.name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Al Pacino&#x27;</span>
    );
 
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">

<h1 id="%C5%A1e-nekaj-primerov">Še nekaj primerov</h1>
<ul>
<li data-marpit-fragment="1">Baza filmov (SQLite)</li>
<li data-marpit-fragment="2">V katerih žanrih je posnetih največ filmov?</li>
<li data-marpit-fragment="3">Podatki v tabeli <code>pripada</code> - film ima lahko več žanrov!</li>
<li data-marpit-fragment="4">Imena žanrov so v tabeli <code>zanr</code>.</li>
<li data-marpit-fragment="5">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naziv, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> stevilo
  <span class="hljs-keyword">FROM</span> pripada
  <span class="hljs-keyword">JOIN</span> zanr <span class="hljs-keyword">ON</span> zanr <span class="hljs-operator">=</span> id
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> id, naziv
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> stevilo <span class="hljs-keyword">DESC</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="povpre%C4%8Dna-ocena-in-dol%C5%BEina-po-%C5%BEanrih">Povprečna ocena in dolžina po žanrih</h1>
<ul>
<li data-marpit-fragment="1">Ocene in dolžine so v tabeli <code>film</code>.</li>
<li data-marpit-fragment="2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naziv,
       <span class="hljs-built_in">AVG</span>(ocena) <span class="hljs-keyword">AS</span> povprecna_ocena,
       <span class="hljs-built_in">AVG</span>(dolzina) <span class="hljs-keyword">AS</span> povprecna_dolzina
  <span class="hljs-keyword">FROM</span> film
  <span class="hljs-keyword">JOIN</span> pripada <span class="hljs-keyword">ON</span> film.id <span class="hljs-operator">=</span> film
  <span class="hljs-keyword">JOIN</span> zanr <span class="hljs-keyword">ON</span> zanr <span class="hljs-operator">=</span> zanr.id
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> zanr.id, naziv
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> povprecna_ocena <span class="hljs-keyword">DESC</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="filmi-z-ve%C4%8D-kot-enim-re%C5%BEiserjem">Filmi z več kot enim režiserjem</h1>
<span class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naslov, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> st_reziserjev
  <span class="hljs-keyword">FROM</span> vloga
  <span class="hljs-keyword">JOIN</span> film <span class="hljs-keyword">ON</span> film <span class="hljs-operator">=</span> id
 <span class="hljs-keyword">WHERE</span> tip <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;R&#x27;</span>
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> naslov
<span class="hljs-keyword">HAVING</span> st_reziserjev <span class="hljs-operator">&gt;</span> <span class="hljs-number">1</span>
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> st_reziserjev <span class="hljs-keyword">DESC</span>;
</code></pre>
<ul>
<li data-marpit-fragment="1">Zakaj je to narobe?</li>
<li data-marpit-fragment="2">Pravilno:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naslov, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> st_reziserjev
  <span class="hljs-keyword">FROM</span> vloga
  <span class="hljs-keyword">JOIN</span> film <span class="hljs-keyword">ON</span> film <span class="hljs-operator">=</span> id
<span class="hljs-keyword">WHERE</span> tip <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;R&#x27;</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> id, naslov
<span class="hljs-keyword">HAVING</span> st_reziserjev <span class="hljs-operator">&gt;</span> <span class="hljs-number">1</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> st_reziserjev <span class="hljs-keyword">DESC</span>;
</code></pre>
</li>
</ul>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-fragments="3" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="romanti%C4%8Dne-komedije">Romantične komedije</h1>
<ul>
<li data-marpit-fragment="1">Zanimajo nas filmi, ki imajo med žanri <em>Comedy</em> in <em>Romance</em>.</li>
<li data-marpit-fragment="2">Poskusimo:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> film <span class="hljs-keyword">FROM</span> pripada
 <span class="hljs-keyword">WHERE</span> zanr <span class="hljs-operator">=</span> <span class="hljs-number">4</span> <span class="hljs-keyword">AND</span> zanr <span class="hljs-operator">=</span> <span class="hljs-number">8</span>;
</code></pre>
<ul>
<li>Zakaj to ni OK?</li>
</ul>
</li>
<li data-marpit-fragment="3">Želimo tiste filme, za katere obstaja tako vrstica z <code>zanr = 4</code> kot tudi z <code>zanr = 8</code>!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="2" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="romanti%C4%8Dne-komedije-2">Romantične komedije (2)</h1>
<ul>
<li data-marpit-fragment="1">Dobimo ID-je vseh filmov, za katere se pojavita oba žanra.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> film <span class="hljs-keyword">FROM</span> pripada
  <span class="hljs-keyword">JOIN</span> zanr <span class="hljs-keyword">ON</span> zanr <span class="hljs-operator">=</span> id
 <span class="hljs-keyword">WHERE</span> naziv <span class="hljs-keyword">IN</span> (<span class="hljs-string">&#x27;Comedy&#x27;</span>, <span class="hljs-string">&#x27;Romance&#x27;</span>)
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> film
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
</code></pre>
</li>
<li data-marpit-fragment="2">Lahko bi uporabili kot podpoizvedbo, ali pa staknemo zraven še tabelo <code>filmi</code>.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naslov <span class="hljs-keyword">FROM</span> film
  <span class="hljs-keyword">JOIN</span> pripada <span class="hljs-keyword">ON</span> film.id <span class="hljs-operator">=</span> film
  <span class="hljs-keyword">JOIN</span> zanr <span class="hljs-keyword">ON</span> zanr <span class="hljs-operator">=</span> zanr.id
 <span class="hljs-keyword">WHERE</span> naziv <span class="hljs-keyword">IN</span> (<span class="hljs-string">&#x27;Comedy&#x27;</span>, <span class="hljs-string">&#x27;Romance&#x27;</span>)
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> film.id, naslov
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="3" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="igralec-in-re%C5%BEiser-v-istem-filmu">Igralec in režiser v istem filmu</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> naslov, ime <span class="hljs-keyword">FROM</span> film
  <span class="hljs-keyword">JOIN</span> vloga <span class="hljs-keyword">ON</span> film.id <span class="hljs-operator">=</span> film
  <span class="hljs-keyword">JOIN</span> oseba <span class="hljs-keyword">ON</span> oseba <span class="hljs-operator">=</span> oseba.id
 <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> film.id, naslov, oseba.id, ime
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
</code></pre>
<ul>
<li data-marpit-fragment="1">Deluje, ker sta edini vlogi igralec in režiser.</li>
<li data-marpit-fragment="2">Kaj pa, če bi lahko imeli več vlog, pa nas vseeno zanimata samo ti dve?</li>
<li data-marpit-fragment="3">Ali pa če se nekdo večkrat pojavi kot igralec (npr. več likov v istem filmu)?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="igralec-in-re%C5%BEiser-v-istem-filmu-2">Igralec in režiser v istem filmu (2)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> reziser <span class="hljs-keyword">AS</span> (
       <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> vloga
        <span class="hljs-keyword">WHERE</span> tip <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;R&#x27;</span>
     ),
     igralec <span class="hljs-keyword">AS</span> (
       <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> vloga
        <span class="hljs-keyword">WHERE</span> tip <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;I&#x27;</span>
     )
<span class="hljs-keyword">SELECT</span> naslov, ime <span class="hljs-keyword">FROM</span> reziser
  <span class="hljs-keyword">JOIN</span> igralec <span class="hljs-keyword">USING</span> (oseba, film)
  <span class="hljs-keyword">JOIN</span> film <span class="hljs-keyword">ON</span> film.id <span class="hljs-operator">=</span> film
  <span class="hljs-keyword">JOIN</span> oseba <span class="hljs-keyword">ON</span> oseba.id <span class="hljs-operator">=</span> oseba;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="kaj-po%C4%8Dne-ta-poizvedba">Kaj počne ta poizvedba?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> film.<span class="hljs-operator">*</span>
  <span class="hljs-keyword">FROM</span> pripada <span class="hljs-keyword">AS</span> prvi
  <span class="hljs-keyword">JOIN</span> pripada <span class="hljs-keyword">AS</span> drugi <span class="hljs-keyword">USING</span> (film)
  <span class="hljs-keyword">JOIN</span> film <span class="hljs-keyword">ON</span> id <span class="hljs-operator">=</span> film
 <span class="hljs-keyword">WHERE</span> prvi.zanr <span class="hljs-operator">=</span> <span class="hljs-number">4</span> <span class="hljs-keyword">AND</span>
       drugi.zanr <span class="hljs-operator">=</span> <span class="hljs-number">8</span> <span class="hljs-keyword">AND</span>
       oznaka <span class="hljs-operator">&lt;&gt;</span> <span class="hljs-string">&#x27;R&#x27;</span>
 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> film.glasovi <span class="hljs-keyword">DESC</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">

<h1 id="primer-na%C4%8Drtovanja-baze-banka">Primer načrtovanja baze: banka</h1>
<ul>
<li data-marpit-fragment="1">Hraniti želimo podatke o komitentih banke ter njihovih računih in transakcijah.
<ul>
<li>Za komitenta hranimo EMŠO, ime, priimek in naslov.</li>
<li>Vsak komitent ima lahko več računov.</li>
<li>Za vsako transakcijo na nekem računu beležimo znesek, čas in neobvezen opis.</li>
</ul>
</li>
</ul>
</section>

<h1 id="logi%C4%8Dni-model-sqlite">Logični model (SQLite)</h1>
<span class="columns small col2">
<span>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> kraj (
  posta    <span class="hljs-type">integer</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  kraj     text    <span class="hljs-keyword">NOT NULL</span>
);

<span class="hljs-keyword">CREATE TABLE</span> oseba (
  emso     text    <span class="hljs-keyword">PRIMARY KEY</span>,
  ime      text    <span class="hljs-keyword">NOT NULL</span>,
  priimek  text    <span class="hljs-keyword">NOT NULL</span>,
  ulica    text    <span class="hljs-keyword">NOT NULL</span>,
  posta    <span class="hljs-type">integer</span> <span class="hljs-keyword">NOT NULL</span>
             <span class="hljs-keyword">REFERENCES</span> kraj(posta)
);
</code></pre>
</span>
<span>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> racun (
  stevilka <span class="hljs-type">integer</span> <span class="hljs-keyword">PRIMARY KEY</span>
                   AUTOINCREMENT,
  lastnik  text    <span class="hljs-keyword">NOT NULL</span>
             <span class="hljs-keyword">REFERENCES</span> oseba(emso)
);

<span class="hljs-keyword">CREATE TABLE</span> transakcija (
  id       <span class="hljs-type">integer</span>   <span class="hljs-keyword">PRIMARY KEY</span>
                     AUTOINCREMENT,
  racun    <span class="hljs-type">integer</span>   <span class="hljs-keyword">NOT NULL</span>
             <span class="hljs-keyword">REFERENCES</span> racun(stevilka),
  znesek   <span class="hljs-type">integer</span>   <span class="hljs-keyword">NOT NULL</span>, 
  cas      <span class="hljs-type">timestamp</span> <span class="hljs-keyword">NOT NULL</span>
             <span class="hljs-keyword">DEFAULT</span> <span class="hljs-built_in">CURRENT_TIMESTAMP</span>,
  opis     text
);
</code></pre>
</span>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="4" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="kako-deluje-internet">Kako deluje internet</h1>
<span class="small">
<ul>
<li data-marpit-fragment="1">Internet je v osnovi ogromno omrežje, v katerega so povezani računalniki (in ostale naprave).</li>
<li data-marpit-fragment="2">Lahko si ga predstavljamo kot graf.
<ul>
<li>Posamezni računalniki so listi tega grafa.</li>
<li>Vmesna vozlišča so usmerjevalniki.</li>
</ul>
</li>
<li data-marpit-fragment="3">Če se želita dva računalnika pogovarjati, je potrebno poiskati pot v tem grafu.
<ul>
<li>Za iskanje učinkovitih poti skrbijo usmerjevalniki.</li>
</ul>
</li>
<li data-marpit-fragment="4">Vsaka naprava na internetu ima svoj naslov.<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ host www.google.com
www.google.com has address 142.250.186.68
www.google.com has IPv6 address 2a00:1450:400d:80e::2004
</code></pre>
<ul>
<li>Vsaka naprava lahko uporablja naslova 127.0.0.1 (IPv4) ali ::1 (IPv6) za sklicevanje nase.</li>
</ul>
</li>
</ul>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="5" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="dns---domain-name-system">DNS - <em>Domain Name System</em></h1>
<span class="small">
<ul>
<li data-marpit-fragment="1">Za lažjo uporabo napravam v omrežju dodelimo hierarhično organizirana imena.</li>
<li data-marpit-fragment="2">Primer: <code>www.google.com</code>
<ul>
<li>Vrhnja domena: <code>com</code> (ali <code>net</code>, <code>org</code>, ..., ter državne domene, kot <code>si</code>, ...)</li>
<li>Organizacija (znotraj <code>com</code>): <code>google</code></li>
<li>Naprava (znotraj <code>google.com</code>): <code>www</code></li>
</ul>
</li>
<li data-marpit-fragment="3">Naslove, ki ustrezajo imenom, hranijo hierarhično organizirani imenski strežniki.</li>
<li data-marpit-fragment="4">Ko se želimo povezavi na <code>www.google.com</code>, pošljemo poizvedbo imenskemu strežniku internetnega ponudnika.
<ul>
<li>Če odgovora ne pozna, povpraša vrhnji strežnik, nato strežnik za <code>com</code>, nazadnje še strežnik za <code>google.com</code>.</li>
</ul>
</li>
<li data-marpit-fragment="5">Ime <code>localhost</code> ustreza naslovoma 127.0.0.1 in ::1.</li>
</ul>
</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="3" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="protokoli-in-vrata">Protokoli in vrata</h1>
<ul>
<li data-marpit-fragment="1">Za pošiljanje podatkov med računalniki se uporabljata omrežna protokola IPv4 in IPv6 (<em>Internet Protocol</em>, različici 4 in 6).</li>
<li data-marpit-fragment="2">Na posamezni napravi lahko teče več aplikacij, vsaka uporablja določena <em>vrata</em> pri enem od transportnih protokolov.
<ul>
<li>UDP (<em>User Datagram Protocol</em>) - za DNS, IPTV, IP telefonijo, ...</li>
<li>TCP (<em>Transmission Control Protocol</em>) - za večino storitev</li>
</ul>
</li>
<li data-marpit-fragment="3">Številke vrat so večinoma standardizirane:
<ul>
<li>53/UDP: DNS</li>
<li>80/TCP: HTTP (<em>Hypertext Transfer Protocol</em>)</li>
<li>443/TCP: HTTPS (HTTP preko SSL/TLS - šifrirana povezava)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-fragments="4" data-style="@import url('style.css')" lang="sl-SI" style="--style:@import url('style.css');">
<h1 id="kaj-se-zgodi-ko-v-brskalnik-vtipkamo-httpswwwgooglecom">Kaj se zgodi, ko v brskalnik vtipkamo <code>https://www.google.com/</code></h1>
<ul>
<li data-marpit-fragment="1">Operacijski sistem pošlje zahtevo imenskemu strežniku po protokolu DNS za IP naslov, ki ustreza imenu <code>www.google.com</code>.
<ul>
<li>Odgovor si zapomni, da ni potrebno vsakič spraševati.</li>
</ul>
</li>
<li data-marpit-fragment="2">Z računalnikom na dobljenem naslovu poskusi vzpostaviti sejo TCP na vratih 443.
<ul>
<li>Seja TCP skrbi za zanesljiv prenos podatkov.</li>
</ul>
</li>
<li data-marpit-fragment="3">Po vzpostavljeni seji se vzpostavi šifriran kanal po protokolu SSL/TLS.</li>
<li data-marpit-fragment="4">Brskalnik ima sedaj na voljo povezavo s spletnim strežnikom, s katerim se pogovarja po protokolu HTTP.</li>
</ul>
</section>
